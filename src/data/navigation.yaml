  - id: web/oscclients/details
    path: Web > System > Control & Integrations > OSC Clients > Details
    route: /op/oscclients/:id
    source: src/AdminSite/ClientApp/src/views/operation/OscClientDetails.vue
    permission: EDITREMOTECONTROL
    sections:
      - title: OSC Client
        fields:
          - label: Internal Id
            key: oscClientId
            type: text
            readOnly: true
          - label: Name
            key: name
            type: text
            help: Human-friendly label, e.g. "FOH iPad".
          - label: Any Source IP
            key: anySource
            type: bool
            help: Accept OSC from any device on the network - useful when the controller gets its IP from DHCP, or when several devices share one layout. Feedback is sent to every device heard from in the last 5 minutes. Only one client can accept any source, and it only claims addresses its surface has assignments for; other OSC traffic still reaches Input Triggers.
          - label: Source IP
            key: sourceIp
            type: text
            required: true
            help: IPv4 address of the device sending OSC. Must be unique across clients.
            visibleWhen: not (Any Source IP is on)
          - label: Feedback Port
            key: feedbackPort
            type: number
            help: UDP port on the client to send feedback replies to. Leave blank for no feedback (surface still dispatches incoming events).
          - label: Send device status updates
            key: sendStatusUpdates
            type: bool
            help: Send this client the periodic device-status feedback stream (master dimmer, fixture RGB, playback status and cue, control levels). Replies go to the source port, or the Feedback Port when set. On the "Any Source IP" client this enables status for every connected device, unless a device matches a specific-IP client, which overrides it. Off by default.
          - label: Feedback timeout (hours)
            key: feedbackTimeoutHours
            type: number
            help: How long a device keeps receiving feedback after its last message. OSC has no connection, so a device that sits idle but is still on the wall would otherwise stop getting feedback. Default 24 hours; set 0 to never time out. Only applies to "Any Source IP" clients - specific-IP clients have a fixed destination and never time out.
            visibleWhen: Any Source IP is on
          - label: Enabled
            key: enabled
            type: bool
    actions:
      - Save
      - Save & Go Back
      - Delete
