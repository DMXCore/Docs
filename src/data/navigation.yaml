  - id: web/channelrules/details
    path: Web > System > Lighting Setup > Channel Rules > Details
    route: /op/channelrules/:id
    source: src/AdminSite/ClientApp/src/views/operation/ChannelRuleDetails.vue
    permission: EDITCHANNELRULES
    sections:
      - title: Channel Rule Details
        fields:
          - label: Internal Id
            key: channelRuleId
            type: text
            readOnly: true
          - label: Name
            key: name
            type: text
          - label: Rule Type
            key: ruleType
            type: option
            options:
              - Cap - limit channels to a maximum value
              - Scale - rescale the full range to a maximum value
              - Copy - duplicate channels to another location
            help: Rules apply during cue playback only (dynamic and static cues), never to fixture control. Cap clamps values above the limit; Scale maps the whole 0-255 range down so full level becomes the limit; Copy mirrors the recorded channels to another slot/channel range (multipatch). Copies are applied first, then scales, then caps - so a cap addressing the copy destination also limits the copied fixture.
          - label: Slot Id
            key: cosmosId
            type: number
            help: Internal (virtual) universe id as recorded in the cue.
          - label: Start Channel
            key: channelStart
            type: number
          - label: End Channel
            key: channelEnd
            type: number
          - label: Destination Slot Id
            key: destinationCosmosId
            type: number
            help: Internal (virtual) universe id the channels are copied to.
            visibleWhen: Rule Type = Copy
          - label: Destination Start Channel
            key: destinationChannelStart
            type: number
            help: The copied range keeps its length, so it must fit within channels 1-512 from this start channel.
            visibleWhen: Rule Type = Copy
          - label: Limit (0-255)
            key: limit
            type: number
            visibleWhen: Rule Type is Cap or Scale
          - label: Enabled
            key: enabled
            type: bool
    actions:
      - Save
      - Save & Go Back
      - Duplicate
      - Delete
