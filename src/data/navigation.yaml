    availableWhen:
      - Releases available
    summary: Lists the available software releases (version, channel, release date and release notes) and marks the running one; the subtitle says whether updates are managed by the DMX Core portal. Where the device can upgrade itself, selecting a version upgrades to it (on an appliance this needs the UpgradeSoftware permission); otherwise the list is read-only.
