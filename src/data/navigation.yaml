    path: Web > System > Utilities > Record > Record Config > Details
    route: /op/utilities/record/recordconfig/:id
    source: src/AdminSite/ClientApp/src/views/operation/InputMappingDetails.vue
    permission: RECORD
    sections:
      - title: Input Mapping Details
        fields:
          - label: Internal Id
            key: inputMappingId
            type: text
            readOnly: true
          - label: Protocol
            key: portType
            type: option
            options:
              - sACN / E1.31
              - Art-Net
              - DMX Serial
            help: The protocol this row receives on. Every protocol that has rows listens, so a console on sACN and one on Art-Net can both be routed at the same time. A recording still captures one protocol, chosen on the Inputs page.
          - label: Start Universe Id
            key: startUniverseId
            type: number
            help: 'The received universe, in the notation of the protocol above (Art-Net counts from 0). On DMX Serial it is the board port number: 1 = port A, 2 = port B.'
          - label: Universe Count
            key: universeCount
            type: number
          - label: Start Slot Id
            key: startCosmosId
            type: number
            help: The slot id the received universe lands on. Slot ranges must not overlap between rows on different protocols - a recording and the merge both key on the slot id.
