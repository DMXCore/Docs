  - id: web/settings/protocol
    path: Web > System > Lighting Setup > Protocol
    route: /op/settings/PROTOCOL
    source: src/AdminSite/ClientApp/src/views/operation/Settings.vue
    permission: CHANGEOUTPUTSETTINGS
    availableWhen:
      - Not remote client mode
      - Lighting license
    sections:
      - fields:
          - label: Output Frequency
            key: outputfrequency
            property: OutputConfig.OutputFrequencyInt
          - label: Optimize Send
            key: optimizesend
            property: OutputConfig.OptimizeSend
          - label: Passthru Function
            key: passthrufunction
            property: OutputConfig.SerialPassthruFunction
            help: 'Put the DMX Core 100 in line between a console and the fixtures: the 2-port DMX-512 board forwards DMX from one port to the other in its firmware, so the console keeps full control of the lights while the DMX Core 100 records the stream. Port to port only, no merge with playback; the destination port is left out of stream routing while it is on.'
            visibleWhen: DMX board with firmware passthrough present
          - label: Master Dimmer Cue Control
            key: masterdimmercuecontrol
            property: OutputConfig.MasterDimmerAppliedToCues
          - label: End of Data
            key: endofdata
            property: OutputConfig.EndOfDataOperation
          - label: Merge Mode
            key: mergemode
            property: OutputConfig.MergeMode
          - label: Fixture Control Priority
            key: fixturecontrolpriority
            property: OutputConfig.FixtureControlPriorityInt
            help: "Merge priority for fixture control (presets and direct control) against cue playback (1-200). Higher than the cue's priority (default 100): fixture control takes over its controlled channels while the cue keeps the rest. Lower: cue playback wins. Equal: values combine using the Merge Mode."
          - label: Input Priority
            key: inputpriority
            property: OutputConfig.InputPriorityInt
            help: Merge priority for input routed to outputs (Route Input to Outputs on the Inputs page) from protocols without a wire priority (Art-Net, DMX serial), 1-200. sACN input uses the priority the sender transmits unless Override Input Priority is on. Above the cue's priority (default 100) the input takes over the universe; below it the cue wins; equal combines using the Merge Mode.
          - label: Override Input Priority
            key: overrideinputpriority
            property: OutputConfig.OverrideInputPriority
            help: Use Input Priority for all routed input, ignoring the priority an sACN sender transmits.
          - label: Input Loss Timeout (ms)
            key: inputlosstimeoutms
            property: OutputConfig.InputLossTimeoutMS
            help: How long a routed universe may go without a packet from its source before it is considered lost (E1.31 default 2500 ms). What happens then is On Input Loss.
          - label: On Input Loss
            key: oninputloss
            property: OutputConfig.InputLossOperation
            help: 'Release: stop sending the universe; a cue or preset underneath takes back over, otherwise the End of Data applies. Hold last: keep sending the last received frame. Blackout and release: send zeros once, then release.'
