  - id: web/inputtriggers/details
    path: Web > System > Control & Integrations > Input Triggers > Details
    route: /op/inputtriggers/:id
    source: src/AdminSite/ClientApp/src/views/operation/InputTriggerDetails.vue
    permission: EDITINPUTTRIGGER
    sections:
      - title: Input Trigger Details
        fields:
          - label: Internal Id
            key: inputTriggerId
            type: text
            readOnly: true
          - label: Code / Short Name
            key: code
            type: text
          - label: Name
            key: name
            type: text
          - label: Enabled
            key: enabled
            type: bool
          - label: Type
            key: type
            type: option
            options:
              - Art-Net
              - Control Value
              - DMX Serial
              - HTTP
              - MQTT
              - OSC
              - Plugin
              - sACN
              - TCP
              - UDP
              - Digital Input
            help: "When Type = Plugin: Fired by an installed plugin using this trigger's Code / Short Name. Only the action below needs to be configured."
          - label: Address
            key: address
            type: text
            help: 'When Type is OSC or MQTT: Enter [payload] in the address to use the payload below in the address. Address should start with a /. When Type = Plugin: Optional plugin id (e.g. example-plugin) to restrict this trigger to one plugin. Leave blank to let any installed plugin fire it.'
            visibleWhen: Type is HTTP, OSC, MQTT, Control Value or Plugin
          - label: Mode
            key: mode
            type: option
            options:
              - On/Off - run an action
              - Value - set a level from the payload
            help: Value mode uses the numeric payload to drive a Control Value (e.g. Symetrix volume), master dimmer, or zone intensity.
            visibleWhen: Type is MQTT, HTTP, OSC or Control Value
          - label: Port
            key: port
            type: number
            visibleWhen: Type is TCP or UDP
          - label: JSON Path (optional)
            key: inputJsonPath
            type: text
            help: For JSON payloads, e.g. $.volume. Leave blank if the payload is a plain number.
            visibleWhen: Type is MQTT or HTTP and Mode = Value
          - label: Input Min
            key: inputMin
            type: number
            help: Raw payload value that maps to 0%. Default 0.
            visibleWhen: Type is MQTT, HTTP or OSC and Mode = Value
          - label: Input Max
            key: inputMax
            type: number
            help: Raw payload value that maps to 100%. Default 1.
            visibleWhen: Type is MQTT, HTTP or OSC and Mode = Value
          - label: Transform Script (optional)
            key: valueTransformScriptCode
            type: option
            help: Optional script that reshapes the normalized 0..1 value (curves, dead zones, thresholds). The script sees "value" and "payload"; its last expression is the transformed 0..1 value. If the script fails, the update is skipped.
            visibleWhen: Type is MQTT, HTTP, OSC or Control Value and Mode = Value
          - label: Start Payload
            key: startPayload
            type: text
            help: 'When Type is TCP or UDP: Payload can be a string "TEST" (case sensitive), or comma/space-separated hex bytes: 40,41,42,0D,0A. When Type = OSC: Payload is compared as a string. When Type = Control Value: Choice name (case insensitive) or index that fires the trigger when it becomes active.'
            visibleWhen: Type is TCP or UDP or (Type = OSC and Mode is not Value) or (Type = MQTT and Mode is not Value) or (Type = Control Value and Mode is not Value and Control Value Kind = SELECTOR)
          - label: Stop Payload
            key: stopPayload
            type: text
            help: 'When Type = Control Value: Optional choice that clears the triggered state. Leave blank to clear on any other choice.'
            visibleWhen: Type is TCP or UDP or (Type = OSC and Mode is not Value) or (Type = MQTT and Mode is not Value) or (Type = Control Value and Mode is not Value and Control Value Kind = SELECTOR)
          - label: Universe Id/Sub Port
            key: universeId
            type: number
            visibleWhen: Type is sACN, Art-Net, DMX Serial or Digital Input
          - label: Channel
            key: channel
            type: number
            visibleWhen: Type is sACN, Art-Net or DMX Serial
          - label: Threshold
            key: threshold
            type: number
            help: 'When Type = Digital Input: If set to 1 the trigger will execute when the input is high. Set to 0 to reverse logic. When Type = Control Value: Fires when the level rises to or above this percent (0-100); re-arms when it drops below. Otherwise: DMX value above this will start the trigger (and equal or below will stop the trigger)'
            visibleWhen: Type is sACN, Art-Net, DMX Serial or Digital Input or (Type = Control Value and Mode is not Value and Control Value Kind = LEVEL)
          - label: DMX Trigger Mode
            key: dmxTriggerMode
            type: option
            options:
              - Above Threshold
              - Zero Then Above Threshold
            visibleWhen: Type is sACN, Art-Net or DMX Serial
          - label: Created/Last modified
            key: createdLastModifiedText
            type: text
            readOnly: true
            visibleWhen: Item has been saved
      - title: Action
        fields:
          - label: Action Type
            key: type
            type: option
            required: true
            options:
              - (No action)
              - Apply Ambient Preset
              - Apply Preset
              - Audio Mute
              - Blackout
              - Control Value
              - DMX Output
              - Fade Out
              - Fire Output Event
              - Play Cue
              - Play Sound
              - Play Timeline
              - Run Script
              - Step Effect
              - Stop
              - Tap Tempo
              - Toggle Schedule
          - label: Target
            key: playCode
            type: option
            visibleWhen: Action Type is Play Cue, Apply Preset, Play Sound, Play Timeline, Apply Ambient Preset, Toggle Schedule, Fire Output Event, Control Value, Run Script or Step Effect
          - label: Press Mode
            key: mode
            type: option
            required: true
            options:
              - Normal
              - Toggle on/off
              - Flash (hold)
              - Momentary (release continues past Hold)
            visibleWhen: Action Type is Play Cue, Apply Preset, Play Sound, Apply Ambient Preset or Play Timeline
          - label: Set To
            key: targetState
            type: option
            required: true
            options:
              - Toggle
              - On
              - Off
            help: 'When Action Type = Audio Mute: On = audio muted, Off = audio unmuted, Toggle = flip the current state. When Action Type = Blackout: On = blackout engaged (every channel 0%, audio muted, playback keeps running underneath), Off = released, Toggle = flip the current state. Otherwise: On = DMX output enabled, Off = DMX output suppressed, Toggle = flip the current state.'
            visibleWhen: Action Type is Audio Mute, DMX Output or Blackout
          - label: Fade-In Time (ms)
            key: fadeInDurationMS
            type: number
            visibleWhen: Action Type is Play Cue, Apply Preset, Play Sound, Play Timeline or Apply Ambient Preset
          - label: Fade-Out Time (ms)
            key: fadeOutDurationMS
            type: number
            visibleWhen: Action Type is Play Cue, Apply Preset, Play Sound, Play Timeline, Apply Ambient Preset or Fade Out
          - label: Dimmer
            key: dimmerScale
            type: range
            visibleWhen: Action Type is Play Cue, Apply Preset, Play Timeline or Apply Ambient Preset
          - label: Volume
            key: volume
            type: range
            visibleWhen: Action Type is Play Sound or Play Timeline
          - label: Loop (0 = forever)
            key: loop
            type: number
            visibleWhen: Action Type is Play Cue or Play Sound
          - label: Operation
            key: controlValueOperation
            type: option
            required: true
            options:
              - Set value
              - Up
              - Down
              - Toggle
            visibleWhen: Action Type = Control Value
          - label: Value
            key: controlValueSetValue
            type: text
            visibleWhen: Action Type = Control Value and Operation = Set value
      - title: Value Target
        fields:
          - label: Target
            key: target
            type: option
            options:
              - (none - unassigned)
              - Master Dimmer
              - Audio Volume
              - Fixture Intensity
              - Fixture RGB - Red
              - Fixture RGB - Green
              - Fixture RGB - Blue
              - Zone Intensity
              - Control Value (Level)
          - label: Fixture code / Zone code / Control Value
            key: targetCode
            type: text
            help: 'Labeled by target: Zone code for Zone Intensity, Control Value (a dropdown) for Control Value (Level), otherwise Fixture code. Fixture and zone codes must match the code assigned in the fixture/zone editor.'
            visibleWhen: Target is Fixture Intensity, Fixture RGB - Red, Fixture RGB - Green, Fixture RGB - Blue, Zone Intensity or Control Value (Level)
          - label: Min value
            key: minValue
            type: number
            help: Percent (0-100); on MIDI surfaces 0..1, mapped from CC 0.
          - label: Max value
            key: maxValue
            type: number
            help: Percent (0-100); on MIDI surfaces 0..1, mapped from CC 127.
          - label: Inverted
            key: inverted
            type: bool
    actions:
      - Save
      - Save & Go Back
      - Delete
